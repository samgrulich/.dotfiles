# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

# $font = Monospace
# $font = FlexRounded
# $font = FiraCode
$font = Sans

$bg_color = 1c1c1c
$fg_color = eadab2

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # path = /home/sam/Downloads/IMG_1909.jpg
    # path = /home/sam/Pictures/Wallpapers/sand-dune.jpg
    # path = /home/sam/Pictures/Wallpapers/abstract-sand-dunes.jpg
    path = /home/sam/Pictures/Wallpapers/moon-dark.jpg
    # path = /home/sam/Pictures/Wallpapers/mural.jpg
    blur_passes = 1
    blur_size = 2
    # path = screenshot
    # blur_passes = 3
}

# image {
#     monitor = 
#     path = /home/sam/Pictures/Wallpapers/mural.jpg
#     position = 0, 120
#     rounding = 16
#
#     size = 120
#
#     halign=center
#     valign=center
# }

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    # inner_color = rgba(0, 0, 0, 0.2) # no fill
    inner_color = rgb($bg_color) 

    outer_color = rgb($fg_color) 
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    # font_color = rgb(143, 143, 143)
    font_color = rgb($fg_color)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    # position = 0, -20
    position = 0, -300
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    color = rgb($fg_color)

    position = 0, -60
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d.%m." # update every 60 seconds
    font_size = 25
    font_family = $font

    color = rgb($fg_color)

    position = 0, -210
    halign = center
    valign = top
}

